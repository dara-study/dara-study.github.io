<script>
  const params = new URLSearchParams(window.location.search);

  const order = params.get("order");
  const controls = params.get("controls");

  const validOrder = order === "12" || order === "21";
  const validControls = controls === "1" || controls === "2";

  if (validOrder && validControls) {
    document.querySelector(".study-nav").hidden = false;

    // Decide which visualisation belongs at each navbar position.
    const pages =
      order === "21"
        ? ["vis2.html", "vis1.html", "vis3.html", "vis4.html"]
        : ["vis1.html", "vis2.html", "vis3.html", "vis4.html"];

    const links = document.querySelectorAll(".study-nav a");

    links.forEach((link, index) => {
      const url = new URL(pages[index], window.location.href);

      // Keep the participant's assignment as they navigate.
      url.searchParams.set("order", order);
      url.searchParams.set("controls", controls);

      link.href = url.href;
    });

    // Highlight the participant's current navbar position.
    const currentPage = window.location.pathname.split("/").pop();

    links.forEach((link) => {
      const linkPage = new URL(link.href).pathname.split("/").pop();

      if (linkPage === currentPage) {
        link.classList.add("active");
        link.setAttribute("aria-current", "page");
      }
    });

  } else {
    console.warn("Missing or invalid study assignment in URL.");
